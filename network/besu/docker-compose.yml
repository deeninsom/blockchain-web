version: "3.9"

# ============================================================
# Hyperledger Besu — IBFT 2.0 Multi-Node Network (4 Validators)
# Managed by a single organization for private blockchain testing
# ============================================================

networks:
  besu-ibft-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.239.0/24

services:
  # ============================
  # Validator Node 1 (RPC: 8545)
  # ============================
  besu-ibft-node1:
    image: hyperledger/besu:latest
    container_name: besu-ibft-node1
    networks:
      besu-ibft-network:
        ipv4_address: 172.16.239.11
    ports:
      - "8545:8545"       # RPC HTTP
      - "8546:8546"       # WebSocket
      - "30303:30303"     # P2P
    volumes:
      - ./genesis:/genesis
      - ./data/node1:/var/lib/besu
      - ./keys/node1:/keys
    command: >
      --genesis-file=/genesis/ibft-genesis.json
      --data-path=/var/lib/besu
      --node-private-key-file=/keys/key
      --rpc-http-enabled
      --rpc-http-host=0.0.0.0
      --rpc-http-port=8545
      --rpc-http-cors-origins="*"
      --rpc-http-api=ETH,NET,WEB3,IBFT,ADMIN,DEBUG,MINER,TXPOOL
      --rpc-ws-enabled
      --rpc-ws-host=0.0.0.0
      --rpc-ws-port=8546
      --host-allowlist="*"
      --p2p-host=172.16.239.11
      --p2p-port=30303
      --min-gas-price=0
      --sync-min-peers=0
      --static-nodes-file=/genesis/static-nodes.json
    restart: unless-stopped

  # ============================
  # Validator Node 2 (RPC: 8547)
  # ============================
  besu-ibft-node2:
    image: hyperledger/besu:latest
    container_name: besu-ibft-node2
