      --genesis-file=/genesis/ibft-genesis.json
      --data-path=/var/lib/besu
      --node-private-key-file=/keys/key
      --rpc-http-enabled
      --rpc-http-host=0.0.0.0
      --rpc-http-port=8545
      --rpc-http-cors-origins="*"
      --rpc-http-api=ETH,NET,WEB3,IBFT,ADMIN
      --host-allowlist="*"
      --p2p-host=172.16.239.12
      --p2p-port=30303
      --min-gas-price=0
      --sync-min-peers=0
      --static-nodes-file=/genesis/static-nodes.json
    restart: unless-stopped

  # ============================
  # Validator Node 3 (RPC: 8548)
